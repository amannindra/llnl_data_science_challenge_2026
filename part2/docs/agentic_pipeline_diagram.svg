  <rect x="560" y="1322" width="26" height="18" rx="4" fill="#fff" stroke="#333" stroke-width="1.8"/>
  <text x="596" y="1336" font-size="12" fill="#222">Solid border = LIVE (currently powers the dashboard)</text>
  <rect x="560" y="1350" width="26" height="18" rx="4" stroke-dasharray="5 4" fill="#fff" stroke="#333" stroke-width="1.8"/>
