<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phase 2C Defect Cluster Explorer</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --foreground: #172033;
      --card: #f7f8fb;
      --card-foreground: #172033;
      --muted-foreground: #657083;
      --border: #d7dce5;
      --input: #c9d0dc;
      --viz-series-1: #2563eb;
      --viz-series-2: #d97706;
      --viz-series-3: #059669;
      --viz-series-4: #dc2626;
      --viz-series-5: #7c3aed;
      --viz-series-6: #0891b2;
      --font-size-base: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111827;
        --foreground: #e5e7eb;
        --card: #182132;
        --card-foreground: #e5e7eb;
        --muted-foreground: #aab3c2;
        --border: #374151;
        --input: #4b5563;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: var(--background);
      color: var(--foreground);
      font: 400 var(--font-size-base)/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .viz-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 12px;
    }
    .form-label {
      display: grid;
      gap: 5px;
      min-width: 150px;
      font-weight: 500;
    }
    .form-select, .btn {
      min-height: 38px;
      border: 1px solid var(--input);
      border-radius: 7px;
      padding: 7px 10px;
      background: var(--background);
      color: var(--foreground);
      font: inherit;
    }
    .btn { cursor: pointer; }
    .btn-ghost { border-color: transparent; }
    .card {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--card-foreground);
    }
    .table-responsive { overflow-x: auto; }
    .table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    .table th, .table td {
      padding: 8px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .table .text-end { text-align: right; }
    .text-small { font-size: 0.82em; }
    .text-muted { color: var(--muted-foreground); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div id="phase2c-cluster-explorer">
  <div class="viz-controls" aria-label="Cluster visualization controls">
    <label class="form-label" for="p2c-color-mode">
      Color by
      <select class="form-select" id="p2c-color-mode">
        <option value="dbscan">DBSCAN cluster (4.56 mm)</option>
        <option value="graph">Graph cluster</option>
        <option value="defect">Defect class</option>
      </select>
    </label>
    <label class="form-label" for="p2c-knn-k" hidden>
      K neighbors
      <select class="form-select" id="p2c-knn-k">
        <option value="1">1</option>
        <option value="3" selected>3</option>
        <option value="5">5</option>
        <option value="10">10</option>
      </select>
    </label>
    <label class="form-label" for="p2c-knn-target" hidden>
      KNN target
      <select class="form-select" id="p2c-knn-target">
        <option value="present" selected>Present</option>
        <option value="unintentional_missing">Unintentional missing</option>
        <option value="unintentional_broken">Unintentional broken</option>
        <option value="intentional_missing">Intentional missing</option>
      </select>
    </label>
    <label class="form-label" for="p2c-knn-links" hidden>
      Neighbor links
      <select class="form-select" id="p2c-knn-links">
        <option value="selected" selected>Selected strut</option>
        <option value="mutual">Mutual KNN</option>
        <option value="off">Off</option>
      </select>
    </label>
    <label class="form-label" for="p2c-cluster-filter">
      Show
      <select class="form-select" id="p2c-cluster-filter"></select>
    </label>
    <button class="btn" id="p2c-reset-view" type="button">Reset view</button>
  </div>

  <div class="p2c-plot-wrap">
    <canvas id="p2c-cluster-canvas" role="img" aria-label="Interactive three-dimensional view of 228 Phase 2C candidate struts"></canvas>
    <div class="p2c-plot-note text-small text-muted">Drag to rotate · scroll to zoom · click a strut</div>
  </div>

  <div id="p2c-legend" class="p2c-legend" aria-label="Color legend"></div>

  <div id="p2c-selection" class="card p2c-selection" aria-live="polite">
    <span class="text-muted">Selected strut</span>
    <span id="p2c-selection-value">Click a strut or choose a cluster below.</span>
    <span class="text-small text-muted" id="p2c-knn-detail"></span>
  </div>

  <div class="table-responsive">
    <table class="table table-sm">
      <thead>
        <tr>
          <th scope="col" id="p2c-category-heading">DBSCAN cluster</th>
          <th scope="col" class="text-end">Struts</th>
          <th scope="col" class="text-end">Share</th>
        </tr>
      </thead>
      <tbody id="p2c-cluster-table"></tbody>
    </table>
  </div>

  <div class="table-responsive" id="p2c-knn-comparison" hidden>
    <table class="table table-sm">
      <thead>
        <tr>
          <th scope="col">Direction</th>
          <th scope="col" class="text-end">Observed</th>
          <th scope="col" class="text-end">Stratified null</th>
          <th scope="col" class="text-end">Attraction q</th>
          <th scope="col" class="text-end">Avoidance q</th>
        </tr>
      </thead>
      <tbody id="p2c-knn-comparison-body"></tbody>
    </table>
  </div>
</div>

<style>
  #phase2c-cluster-explorer {
    width: 100%;
    color: var(--foreground);
  }
  #phase2c-cluster-explorer .p2c-plot-wrap {
    position: relative;
    width: 100%;
    margin-top: 12px;
  }
  #phase2c-cluster-explorer canvas {
    display: block;
    width: 100%;
    height: 500px;
    touch-action: none;
    cursor: grab;
  }
  #phase2c-cluster-explorer canvas:active {
    cursor: grabbing;
  }
  #phase2c-cluster-explorer .p2c-plot-note {
    position: absolute;
    left: 8px;
    bottom: 4px;
    pointer-events: none;
  }
  #phase2c-cluster-explorer .p2c-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
    margin: 10px 0;
  }
  #phase2c-cluster-explorer .p2c-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  #phase2c-cluster-explorer .p2c-swatch {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  #phase2c-cluster-explorer .p2c-selection {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: baseline;
    margin: 10px 0;
  }
  #phase2c-cluster-explorer #p2c-knn-detail {
    flex-basis: 100%;
  }
  #phase2c-cluster-explorer .p2c-cluster-button {
    min-width: 72px;
    justify-content: flex-start;
  }
  @media (max-width: 520px) {
    #phase2c-cluster-explorer canvas {
      height: 390px;
    }
  }
</style>

  function midpoint(edge) {
    return [
      (edge.a[0] + edge.b[0]) / 2,
      (edge.a[1] + edge.b[1]) / 2,
      (edge.a[2] + edge.b[2]) / 2
    ];

  const neighborOrder = new Map();
  Object.entries(KNN_DATA.neighbors).forEach(([sourceId, rows]) => {

      distance: row[1]

  });

    return (neighborOrder.get(edge.id) || []).slice(0, k);
  }

  function knnShare(edge) {
    const selected = neighbors(edge);
    return selected.filter(item => item.edge.category === state.knnTarget).length / state.k;
  }

  function knnBin(edge) {
    const share = knnShare(edge);
    if (share === 0) return "0%";
    if (share <= 0.25) return "1–25%";
    if (share <= 0.5) return "26–50%";
    if (share <= 0.75) return "51–75%";
    return "76–100%";
  }

  function mutualNeighbors() {
    const pairs = [];
    const seen = new Set();
    edges.forEach(source => {
      neighbors(source).forEach(item => {
        const target = item.edge;
        if (!neighbors(target).some(candidate => candidate.edge.id === source.id)) return;
        const key = [source.id, target.id].sort().join("|");
        if (seen.has(key)) return;
        seen.add(key);
        pairs.push([source, target]);
      });
    });
    return pairs;
  }

  function category(edge) {
    if (state.mode === "defect") return edge.defect;
    if (state.mode === "graph") return edge.graph;
    if (state.mode === "knn") return knnBin(edge);
    return edge.dbscan;
  }

  function displayCategory(value) {
    if (state.mode === "dbscan" && value === "-1") return "Noise (−1)";
    if (state.mode === "defect") {
      return value.charAt(0).toUpperCase() + value.slice(1);
    }
    return value;
  }

  function displayKnnCategory(value) {
    if (value == null || value === "") return "Unresolved—not classified";
    return value.replaceAll("_", " ").replace(/\b\w/g, letter => letter.toUpperCase());
  }

  function knnCategoryColorRef(value) {
    return {
      present: "--muted-foreground",
      unintentional_missing: "--viz-series-1",
      unintentional_broken: "--viz-series-2",
      intentional_missing: "--viz-series-3"
    }[value] || "--muted-foreground";
  }

  function categoryCounts() {
    const counts = new Map();
    edges.forEach(edge => counts.set(category(edge), (counts.get(category(edge)) || 0) + 1));
    return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  }

  function categoryColorRef(value, counts) {
    if (state.mode === "dbscan" && value === "-1") return "--muted-foreground";
    if (state.mode === "knn") {
      return {
        "0%": "--muted-foreground",
        "1–25%": "--viz-series-1",
        "26–50%": "--viz-series-2",
        "51–75%": "--viz-series-3",
        "76–100%": "--viz-series-4"
      }[value];
    }
    const index = Math.max(0, counts.findIndex(item => item[0] === value));
    return seriesVars[index % seriesVars.length];
  }

  }

  function updateControls() {
    const counts = categoryCounts();

      filterSelect.appendChild(option);

  function rotated(point) {
    const x = point[0] - 20.52;
    const y = point[1] - 20.52;
    const z = point[2] - 20.52;
    const cy = Math.cos(state.yaw);
    const sy = Math.sin(state.yaw);
    const cp = Math.cos(state.pitch);
    const sp = Math.sin(state.pitch);
    const x1 = x * cy - z * sy;
    const z1 = x * sy + z * cy;
    const y1 = y * cp - z1 * sp;
    const z2 = y * sp + z1 * cp;
    return [x1, y1, z2];
  }

  function makeProjector(width, height) {
    const scale = Math.min(width, height) / 68 * state.zoom;
    const cx = width / 2;
    const cy = height / 2 - 4;
    return point => {
      const rotatedPoint = rotated(point);
      return [cx + rotatedPoint[0] * scale, cy - rotatedPoint[1] * scale, rotatedPoint[2]];
    };
  }

  function drawSegment(a, b, color, width, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]);
    ctx.lineTo(b[0], b[1]);
    ctx.stroke();
    ctx.restore();
  }

  function drawBounds(project) {
    const corners = [
      [0,0,0], [41.04,0,0], [0,41.04,0], [41.04,41.04,0],
      [0,0,41.04], [41.04,0,41.04], [0,41.04,41.04], [41.04,41.04,41.04]
    ];
    const links = [[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
    const projectedCorners = corners.map(project);
    const border = themeColor("--border");
    links.forEach(([a, b]) => drawSegment(projectedCorners[a], projectedCorners[b], border, 1, 0.8));

    const origin = project([0,0,0]);
    const axes = [
      { end: project([8,0,0]), label: "X" },
      { end: project([0,8,0]), label: "Y" },
      { end: project([0,0,8]), label: "Z" }
    ];
    const foreground = themeColor("--muted-foreground");
    ctx.save();
    ctx.fillStyle = foreground;
    ctx.strokeStyle = foreground;

    });
    ctx.restore();
  }

  function resizeCanvas() {

    const pixelWidth = Math.round(width * dpr);

      canvas.width = pixelWidth;
      canvas.height = pixelHeight;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { width, height };
  }

    if (state.mode === "knn" && state.knnLinks !== "off") {
      const linkColor = themeColor("--muted-foreground");
      const activeColor = themeColor("--viz-series-5");
      const pairs = state.knnLinks === "mutual"
        ? mutualNeighbors()
        : state.selected
          ? neighbors(state.selected).map(item => [state.selected, item.edge])
          : [];
      pairs.forEach(([source, target]) => {
        const a = project(midpoint(source));
        const b = project(midpoint(target));
        drawSegment(a, b, state.knnLinks === "selected" ? activeColor : linkColor, 1.5, 0.7);
      });
      if (state.selected) {
        neighbors(state.selected).forEach(item => {
          const a = project(item.edge.a);
          const b = project(item.edge.b);
          const color = themeColor(knnCategoryColorRef(item.edge.category));
          drawSegment(a, b, color, 4, 0.95);
        });
      }
    }

    const projected = edges.map(edge => {
      const a = project(edge.a);
      const b = project(edge.b);
      return { edge, a, b, depth: (a[2] + b[2]) / 2 };
    }).sort((a, b) => a.depth - b.depth);
    state.projected = projected;

    projected.forEach(item => {
      const value = category(item.edge);
      const visible = state.filter === "all" || value === state.filter;
      const selected = state.selected && state.selected.id === item.edge.id;
      const color = themeColor(categoryColorRef(value, counts));
      drawSegment(item.a, item.b, color, selected ? 5 : 3, visible ? 0.95 : 0.08);
    });

    const visibleCount = state.filter === "all"
      ? edges.length
      : edges.filter(edge => category(edge) === state.filter).length;
    canvas.setAttribute(
      "aria-label",
      `Three-dimensional view colored by ${modeMeta[state.mode].label}; ${visibleCount} of ${edges.length} candidate struts visible`
    );
  }

  function distanceToSegment(point, a, b) {
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const lengthSquared = dx * dx + dy * dy;
    if (!lengthSquared) return Math.hypot(point[0] - a[0], point[1] - a[1]);
    const t = Math.max(0, Math.min(1, ((point[0] - a[0]) * dx + (point[1] - a[1]) * dy) / lengthSquared));
    return Math.hypot(point[0] - (a[0] + t * dx), point[1] - (a[1] + t * dy));
  }

  function selectAt(x, y) {
    let best = null;
    let bestDistance = 9;
    state.projected.forEach(item => {
      const value = category(item.edge);
      if (state.filter !== "all" && value !== state.filter) return;
      const distance = distanceToSegment([x, y], item.a, item.b);
      if (distance < bestDistance) {
        bestDistance = distance;
        best = item.edge;
      }
    });
    state.selected = best;
    updateSelection();
    draw();
  }

  modeSelect.addEventListener("change", () => {
    state.mode = modeSelect.value;
    state.filter = "all";
    state.selected = null;
    updateControls();
    updateSelection();
    draw();
  });

  knnKSelect.addEventListener("change", () => {
    state.k = Number(knnKSelect.value);
    state.filter = "all";
    updateControls();
    updateSelection();
    draw();
  });

  knnTargetSelect.addEventListener("change", () => {
    state.knnTarget = knnTargetSelect.value;
    state.filter = "all";
    updateControls();
    updateSelection();
    draw();
  });

  knnLinksSelect.addEventListener("change", () => {
    state.knnLinks = knnLinksSelect.value;
    draw();
  });

  filterSelect.addEventListener("change", () => {
    state.filter = filterSelect.value;
    state.selected = null;
    updateControls();
    updateSelection();
    draw();
  });

  resetButton.addEventListener("click", () => {
    state.yaw = -0.68;
    state.pitch = 0.5;
    state.zoom = 1;
    state.selected = null;
    updateSelection();
    draw();
  });

  canvas.addEventListener("pointerdown", event => {
    canvas.setPointerCapture(event.pointerId);
    state.drag = { x: event.clientX, y: event.clientY, yaw: state.yaw, pitch: state.pitch };
    state.moved = false;
  });

  canvas.addEventListener("pointermove", event => {
    if (!state.drag) return;
    const dx = event.clientX - state.drag.x;
    const dy = event.clientY - state.drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) state.moved = true;
    state.yaw = state.drag.yaw + dx * 0.009;
    state.pitch = Math.max(-1.35, Math.min(1.35, state.drag.pitch + dy * 0.009));
    draw();
  });

  canvas.addEventListener("pointerup", event => {
    if (!state.drag) return;
    const rect = canvas.getBoundingClientRect();
    if (!state.moved) selectAt(event.clientX - rect.left, event.clientY - rect.top);
    state.drag = null;
  });

  canvas.addEventListener("pointercancel", () => {
    state.drag = null;
  });

  canvas.addEventListener("wheel", event => {
    event.preventDefault();
    state.zoom = Math.max(0.55, Math.min(2.6, state.zoom * Math.exp(-event.deltaY * 0.001)));
    draw();
  }, { passive: false });

  const resizeObserver = new ResizeObserver(draw);
  resizeObserver.observe(canvas);
  const themeObserver = new MutationObserver(draw);
  themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ["class", "data-theme", "style"] });

  updateControls();
  updateSelection();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
